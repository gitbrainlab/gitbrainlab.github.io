name: Validate CivicSpec

on:
  push:
    paths: ["specs/civicspec/**", ".github/workflows/civicspec.yml"]
  pull_request:
    paths: ["specs/civicspec/**", ".github/workflows/civicspec.yml"]

permissions:
  contents: read

jobs:
  reference-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: specs/civicspec
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned at initial publication
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install reference validator
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate examples and documentation
        run: python3 scripts/validate.py
      - name: Run negative regression cases
        run: python3 -m unittest discover -s tests -v
      - name: Verify candidate against its pinned Git revision when present
        run: |
          if python3 -c 'import json; raise SystemExit(0 if json.load(open(".well-known/civicspec.json"))["channels"]["candidate"] else 1)'; then
            python3 scripts/verify_published.py
          fi
